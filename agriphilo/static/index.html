<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEMINE Console</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --side: #f4f4f2; --ink: #17181a; --ink-2: #4b4f55; --muted: #8a8f96;
  --line: #e7e7e4; --line-2: #efefec; --hover: #f0f0ed; --accent: #1f7a4d; --accent-2: #e6f2eb;
  --blue: #2b5fd9; --blue-bg: #eaf0fd; --amber: #a15c07; --amber-bg: #fdf3e2; --red: #c0362c; --red-bg: #fdeceb;
  --green: #1f7a4d; --green-bg: #e6f2eb;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--blue); }
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; min-height: 0; }
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #c47a2c, #3b2416); display: grid; place-items: center; color: #fff; flex: none; }
.logo svg { width: 16px; height: 16px; }
.ws b { display: block; font-size: 13.5px; }
.ws small { color: var(--muted); font-size: 12px; }
.nav-h { font-size: 11.5px; color: var(--muted); padding: 12px 8px 4px; font-weight: 500; }
.nav { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: var(--ink-2); border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--hover); }
.nav.on { background: #e9e9e5; color: var(--ink); font-weight: 500; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.nav .hotpill { display: inline-block; background: var(--amber); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 6px; margin-right: 6px; line-height: 16px; }
.content.split .wide-only { display: none; }
.nav svg { width: 15px; height: 15px; flex: none; }
.side-foot { margin-top: auto; padding: 10px 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: grid; gap: 3px; }
.side-foot .live { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.side-foot .live i { width: 7px; height: 7px; border-radius: 50%; background: #2fa565; flex: none; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.top h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
.top select { display: none; font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--panel); }
.demo-pill { font-size: 11.5px; font-weight: 600; color: var(--amber); background: var(--amber-bg); border: 1px solid #f3dcb3; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: 6px; min-width: 0; overflow-x: auto; }
.tab { border: 1px solid transparent; background: none; padding: 4px 10px; border-radius: 6px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--panel); border-color: var(--line); color: var(--ink); box-shadow: 0 1px 1px rgba(0,0,0,.04); }
.tab .n { color: var(--muted); margin-left: 4px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #2d2f33; }
.btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.go:hover:not(:disabled) { background: #19663f; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.user { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.user .av { width: 24px; height: 24px; border-radius: 50%; background: #3b2416; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 11.5px; }
.user a { color: var(--muted); text-decoration: none; } .user a:hover { color: var(--ink); text-decoration: underline; }
@media (max-width: 720px) { .user .nm, .user .sep { display: none; } }
.btn:disabled { opacity: .45; cursor: default; }
.kbd { font-size: 11px; color: #b9bcc0; border: 1px solid #45484d; border-radius: 4px; padding: 0 4px; }
.spacer { flex: 1; }

.content { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
.content.split { grid-template-columns: minmax(0, 1fr) 580px; }
.list { overflow: auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; }
.list th { position: sticky; top: 0; z-index: 1; background: var(--bg); text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.list td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.list th:first-child, .list td:first-child { padding-left: 20px; }
.list th:last-child, .list td:last-child { padding-right: 20px; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--hover); }
tr.row.sel td { background: #eef2fb; }
td.id { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
td.req { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
td.sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.stage-c { white-space: nowrap; color: var(--ink-2); font-size: 12.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-family: var(--font); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-blue { color: var(--blue); background: var(--blue-bg); }
.b-run i { animation: pulse 1.2s infinite; }
.b-amber { color: var(--amber); background: var(--amber-bg); }
.b-green { color: var(--green); background: var(--green-bg); }
.b-red { color: var(--red); background: var(--red-bg); }
.b-gray { color: var(--ink-2); background: var(--line-2); }
.mode { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
@keyframes pulse { 50% { opacity: .25; } }

.empty { display: grid; place-items: center; height: 100%; padding: 40px 16px; text-align: center; }
.empty .box { max-width: 400px; }
.empty h2 { font-size: 16px; margin: 14px 0 6px; }
.empty p { color: var(--ink-2); margin: 0 0 18px; }
.empty .ill { width: 56px; height: 56px; margin: 0 auto; border-radius: 14px; background: var(--accent-2); display: grid; place-items: center; color: var(--accent); }
.none { color: var(--muted); padding: 28px 20px; }

/* detail */
.detail { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.d-head { padding: 16px 20px 0; flex: none; }
.d-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.d-meta .x { margin-left: auto; border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 5px; font-family: var(--font); }
.d-meta .x:hover { background: var(--hover); color: var(--ink); }
.d-title { font-size: 15.5px; font-weight: 600; margin: 8px 0 12px; line-height: 1.35; overflow-wrap: anywhere; }
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 12px; }
.pipe div { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe div::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.pipe .done { color: var(--ink-2); }
.pipe .done::before { background: var(--accent); }
.pipe .running { color: var(--blue); font-weight: 500; }
.pipe .running::before { background: linear-gradient(90deg, var(--blue) 50%, #c9d7f7 50%); background-size: 200% 100%; animation: slide 1.4s linear infinite; }
.pipe .waiting { color: var(--amber); font-weight: 500; }
.pipe .waiting::before { background: #f0c27a; }
.pipe .failed { color: var(--red); font-weight: 500; }
.pipe .failed::before { background: var(--red); }
@keyframes slide { to { background-position: -200% 0; } }
.actbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
.actbar.warn { background: var(--amber-bg); color: #7a4505; }
.actbar.info { background: var(--blue-bg); color: #1c3f91; }
.actbar.ok { background: var(--green-bg); color: #155436; }
.actbar.err { background: var(--red-bg); color: #8e241c; }
.actbar .msg-t { flex: 1; min-width: 180px; }
.d-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); padding: 0 20px; overflow-x: auto; flex: none; scrollbar-width: none; }
.d-tabs::-webkit-scrollbar { display: none; }
.d-tab { border: 0; background: none; padding: 9px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.d-tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.d-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.d-body { flex: 1; overflow: auto; padding: 18px 20px 28px; min-height: 0; }

.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
.banner.info { background: var(--blue-bg); color: #1c3f91; }
.banner.warn { background: var(--amber-bg); color: #7a4505; }
.banner.err { background: var(--red-bg); color: #8e241c; }
.banner.ok { background: var(--green-bg); color: #155436; }
.banner.muted { background: var(--bg); border: 1px solid var(--line); color: var(--ink-2); }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; flex: none; margin-top: 2px; }
@keyframes rot { to { transform: rotate(360deg); } }
.caption { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.wallet { margin: 18px 20px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 16px; }
.wallet-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wallet-bal { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.wallet-bal small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.packs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ledger { margin-top: 14px; font-size: 12.5px; }
.ledger td { padding: 4px 0; border-top: 1px solid var(--line-2); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.kpi { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.kpi:nth-child(3n) { border-right: 0; }
.kpi:nth-last-child(-n+3) { border-bottom: 0; }
.kpi small { display: block; color: var(--muted); font-size: 11.5px; }
.kpi b { font-weight: 600; font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { margin-bottom: 22px; }
.sec h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
.rng { display: grid; grid-template-columns: 150px 1fr 130px; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.rng:last-child { border-bottom: 0; }
.rng .track { height: 6px; background: var(--line-2); border-radius: 3px; position: relative; }
.rng .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
.rng .val { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--bg); }
ul.lst { margin: 0; padding-left: 18px; color: var(--ink-2); }
ul.lst li { margin: 3px 0; }
.kv { color: var(--ink-2); }
.cond { display: flex; gap: 8px; padding: 6px 0; }
.cond .mode { flex: none; height: fit-content; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.grid2 div small { display: block; color: var(--muted); font-size: 11.5px; }
.grid2 div b { font-weight: 500; }

/* summaries, timeline, feed */
.says { display: grid; gap: 8px; }
.say { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.say small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; font-weight: 500; margin-bottom: 2px; }
.say small i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-size: 9px; display: grid; place-items: center; font-weight: 700; }
.tl { position: relative; }
.st { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 8px 0; align-items: start; }
.st + .st { border-top: 1px solid var(--line-2); }
.ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--line); color: var(--muted); background: var(--panel); margin-top: 1px; }
.ico.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.ico.running { border-color: var(--blue); border-right-color: transparent; animation: rot .9s linear infinite; }
.ico.waiting { border-color: #e2a34a; background: var(--amber-bg); color: var(--amber); }
.ico.failed { background: var(--red); border-color: var(--red); color: #fff; }
.st .nm { font-weight: 500; }
.st .nm span { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
.st .dt { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.st .er { color: var(--red); font-size: 12.5px; overflow-wrap: anywhere; }
.st .th { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.st .dur { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed { display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 70px 92px 1fr; gap: 8px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px dashed var(--line-2); }
.ev .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .s { color: var(--ink-2); font-weight: 500; }
.ev .x { color: var(--ink); overflow-wrap: anywhere; }

/* tables in detail */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.m { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.tbl tr.tot td { border-bottom: 0; font-weight: 600; font-size: 14px; padding-top: 10px; }
.tbl tr.subt td { color: var(--ink-2); }
.scroll-x { overflow-x: auto; }
.st-i { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; }
.st-i.pass { background: var(--accent); }
.st-i.warn { background: #d9922b; }
.st-i.fail { background: var(--red); }
.cat { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; padding-top: 12px !important; }

/* coverage */
.cov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cov-c { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.cov-c b { font-weight: 500; font-size: 12.5px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin: 8px 0 4px; }
.bars div { flex: 1; background: #b8dcc6; border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div.zero { background: var(--red-bg); outline: 1px dashed #e8a29c; }
.bars-l { display: flex; gap: 4px; }
.bars-l span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars-x { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* scene */
.preview { width: 100%; border-radius: 8px; border: 1px solid var(--line); image-rendering: pixelated; display: block; background: var(--bg); }
.preview.real { image-rendering: auto; }
.frame16 { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.frame16 iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.frame16 .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #c9ccd1; font-size: 13px; padding: 16px; text-align: center; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 4px; }
ol.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; color: var(--ink-2); }
ol.steps li::before { content: counter(s); flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--accent-2); color: var(--accent); }
.flow { display: grid; gap: 0; }
.flow .fs { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.flow .fs:last-child { border-bottom: 0; }
.flow .fs b { font-weight: 500; }
.flow .fs small { display: block; color: var(--muted); font-size: 12px; }
.flow .fs .who { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
.bigbtn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.prog { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.prog div { height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s; }

/* marketplace */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding: 20px; }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.mcard.own { cursor: pointer; }
.mcard.own:hover { border-color: #c9b7a3; box-shadow: 0 6px 20px rgba(59,36,22,.08); }
.mcard .mimg { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--line-2); }
.mcard .mph { width: 100%; aspect-ratio: 16 / 9; display: grid; place-items: center; background: var(--line-2); color: var(--muted); font-size: 12px; }
.mcard .mb { padding: 14px 14px 16px; display: grid; gap: 8px; flex: 1; align-content: start; }
.mcard .mt { display: flex; align-items: center; gap: 8px; }
.mcard .mt b { font-size: 14.5px; flex: 1; min-width: 0; }
.mcard ol { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
.mcard .ms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-top: 1px solid var(--line-2); padding-top: 8px; }
.mcard .ms div small { display: block; color: var(--muted); font-size: 11px; }
.mcard .ms div b { font-weight: 600; font-size: 13px; }
.mcard .mf { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 2px; }
.mine { font-size: 11px; font-weight: 600; color: var(--blue); background: var(--blue-bg); border-radius: 999px; padding: 1px 8px; }
.buy { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); display: grid; gap: 10px; }
.buy .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.buy input[type=number] { width: 90px; font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--panel); }
.buy .tot { font-size: 18px; font-weight: 700; }
.thumb { width: 120px; max-width: 120px; border-radius: 5px; border: 1px solid var(--line); display: block; }
.stars { color: #d9922b; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }

/* conversation */
.msgs { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; }
.av { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; }
.av.c { background: #e3e4e8; color: var(--ink-2); }
.av.a { background: var(--accent); color: #fff; }
.msg .who { font-size: 12.5px; font-weight: 600; }
.msg .who span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.msg .txt { white-space: pre-wrap; color: var(--ink); margin-top: 2px; overflow-wrap: anywhere; }
.msg ol { margin: 4px 0 0; padding-left: 18px; white-space: normal; }
.composer { border: 1px solid var(--line); border-radius: 10px; margin-top: 18px; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.composer textarea { width: 100%; border: 0; resize: none; min-height: 84px; padding: 12px; font: inherit; background: none; outline: none; display: block; }
.composer .bar { display: flex; align-items: center; padding: 8px; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 12px; gap: 8px; }
pre { margin: 0; font: 11.5px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; }

/* files */
.files { display: grid; gap: 8px; }
.file { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.file .fi { width: 32px; height: 32px; border-radius: 7px; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; font-family: var(--mono); }
.file .fn { flex: 1; min-width: 0; }
.file .fn b { font-weight: 500; font-family: var(--mono); font-size: 12.5px; }
.file .fn small { display: block; color: var(--muted); font-size: 12px; }
.lock { text-align: center; padding: 28px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-2); }
.lock b { display: block; font-size: 14px; margin-bottom: 4px; color: var(--ink); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(20, 22, 25, .35); display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; z-index: 10; }
.scrim.open { display: flex; }
.modal { width: 100%; max-width: 620px; background: var(--panel); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
.m-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.m-head b { color: var(--ink); font-weight: 600; }
.modal textarea { width: 100%; border: 0; resize: vertical; min-height: 170px; padding: 12px 16px; font: 14px/1.55 var(--font); outline: none; display: block; }
.m-ex { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.m-ex button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.m-ex button:hover { background: var(--hover); }
.m-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.m-foot label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 12.5px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }

@media (max-width: 1180px) { .content.split { grid-template-columns: 1fr; } .content.split .list { display: none; } .detail { border-left: 0; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .top { padding: 0 16px; gap: 8px; }
  .top h1 { display: none; }
  .top select { display: block; }
  .tabs { display: none; }
  .hide-m { display: none !important; }
  .newlabel { display: none; }
  .list th:first-child, .list td:first-child { padding-left: 16px; }
  .list th:last-child, .list td:last-child { padding-right: 16px; }
  .rng { grid-template-columns: 1fr; gap: 4px; }
  .rng .val { text-align: left; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3n) { border-right: 1px solid var(--line); }
  .kpi:nth-child(2n) { border-right: 0; }
  .kpi:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
  .kpi:nth-last-child(-n+2) { border-bottom: 0; }
  .d-head, .d-body { padding-left: 16px; padding-right: 16px; }
  .d-tabs { padding: 0 16px; }
  .pipe div { font-size: 0; }
  .cov, .grid2 { grid-template-columns: 1fr; }
  .ev { grid-template-columns: 62px 1fr; }
  .ev .s { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws"><div class="logo" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 12.5 8 6.5 11 12.5 14 3.5"/></svg></div><div><b>WEMINE</b><small>Cafe robot pilot · MuJoCo</small></div></div>
    <button class="nav" data-view="orders"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 6h6M5 8.5h6M5 11h3.5"/></svg>Orders<span class="count" id="cOrders">0</span></button>
    <button class="nav" data-view="market"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6.5 3.5 3h9l1 3.5"/><path d="M2.5 6.5h11a0 0 0 0 1 0 0 2 2 0 0 1-3.7 1 2 2 0 0 1-3.6 0 2 2 0 0 1-3.7-1z"/><path d="M3.5 8.5V13h9V8.5"/></svg>Marketplace<span class="count" id="cMarket">0</span></button>
    <div class="nav-h">Account</div>
    <button class="nav" data-view="billing"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.8" y="3.5" width="12.4" height="9" rx="1.5"/><path d="M1.8 6.5h12.4"/></svg>Billing<span class="count" id="cBilling"></span></button>
    <div class="side-foot">
      <div class="live"><i></i>Agents: Brainbase · Cloudflare sandbox</div>
      <div id="simFoot">Simulator: …</div>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <h1 id="viewTitle">Orders</h1>
      <select id="viewSelect" aria-label="View">
        <option value="orders">Orders</option><option value="market">Marketplace</option><option value="billing">Billing</option>
      </select>
      <div class="tabs" id="filters"></div>
      <div class="spacer"></div>
      <span class="demo-pill" id="demoPill" hidden>Demo mode — scripted agents</span>
      <button class="btn primary" id="newBtn">+<span class="newlabel"> New order</span> <span class="kbd hide-m">N</span></button>
      <div class="user" id="userChip" hidden><span class="av" id="userAv"></span><span class="nm" id="userName"></span>
        <a href="/?switch=1">Switch role</a><span class="sep">·</span><a href="/" id="signOut">Sign out</a></div>
    </header>
    <div class="content" id="content">
      <div class="list" id="list"></div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="m-head"><b id="mTitle">New order</b> · Tell us the robot, the task, the environment, and the data you need (schema &amp; count)</div>
    <textarea id="mText" aria-label="Order description" placeholder="e.g. Robot: a Franka-like single arm. Task: serve a coffee — pick up the cup of coffee and put it on the tray. Environment: a realistic cafe counter. Data: wrist + front camera 128×128 RGB, joint states and actions at 20 Hz, 200 episodes."></textarea>
    <div class="m-ex" id="mEx"></div>
    <div class="m-foot">
      <label><input type="checkbox" id="mAuto"> Fill defaults without asking me</label>
      <div class="spacer"></div>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSubmit">Create order</button>
    </div>
  </div>
</div>

<script>
// Requester session from the login page (/); ?nologin=1 skips the check for local testing.
const USER = (() => { try { return JSON.parse(localStorage.getItem("wemine_user") || "null"); } catch (e) { return null; } })();
if ((!USER || USER.role !== "requester") && !new URLSearchParams(location.search).has("nologin")) location.replace("/" + location.search);
</script>
<script src="/static/app.js"></script>
<script>
const { h } = Agri;
const $ = (id) => document.getElementById(id);

const STATE = {
  running: ["b-blue b-run", "In progress"],
  needs_reply: ["b-amber", "Needs reply"],
  needs_approval: ["b-amber", "Approve spec"],
  live: ["b-green", "Live in marketplace"],
  closed: ["b-gray", "Listing closed"],
  failed: ["b-red", "Failed"],
};
const ACTION = ["needs_reply", "needs_approval"];
const FILTERS = [["all", "All", () => true], ["action", "Action needed", (o) => ACTION.includes(o.state)],
  ["running", "In progress", (o) => o.state === "running"], ["live", "Live", (o) => o.state === "live"]];
const VIEWS = { orders: "Orders", market: "Marketplace", billing: "Billing" };
const TABS = [["overview", "Overview"], ["conversation", "Conversation"], ["spec", "Spec"], ["plan", "Plan"], ["scene", "Scene"],
  ["market", "Marketplace"], ["files", "Files"], ["json", "JSON"]];
const QA_BADGE = { pass: ["b-green", "Pass"], fail: ["b-red", "Fail"], pending: ["b-gray", "Checking…"] };
const FILE_INFO = {
  "dataset.hdf5": "All purchased episodes: states, actions and camera frames (collect_demos format)",
  "manifest.json": "Purchased episode list, players, QA verdicts, sha256",
  "qa_report.json": "QA Agent verdict, quality and reason for every purchased episode",
};

let config = { demo: false, worker: "", pricing_note: "" };
let summaries = [];
let full = null;              // full order JSON for the selected order
let view = "orders", filter = "all", selected = null, tab = "overview";
let listSig = "", detailSig = "";
const drafts = {};

// Composer lives outside the re-rendered DOM so typing survives polling.
const composerTa = h("textarea", { placeholder: "Answer the agent's questions…", "aria-label": "Your reply" });
const sendBtn = h("button.btn.primary", {}, "Send reply");
const composer = h("div.composer", composerTa, h("div.bar", h("span.hide-m", "⌘/Ctrl + Enter to send"), h("div.spacer"), sendBtn));
composerTa.addEventListener("input", () => { if (selected) drafts[selected] = composerTa.value; });
composerTa.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendBtn.click(); });
sendBtn.onclick = () => act("answer", composerTa.value.trim());

function badge(state) {
  const [cls, label] = STATE[state] || ["b-gray", state];
  return h("span.badge." + cls.split(" ").join("."), h("i"), label);
}
const qbadge = (v) => { const [c, l] = QA_BADGE[v] || ["b-gray", v]; return h("span.badge." + c, h("i"), l); };
const stars = (n) => n == null ? h("span.kv", "—") : h("span.stars", { title: `${n} / 5` }, "★".repeat(n), h("span.off", "★".repeat(5 - n)));
const modeLabel = (o) => o.spec ? (o.spec.mode === "failure" ? "Failure repro" : "Generation") : "—";
const since = (ts) => h("span", { "data-since": ts }, Agri.elapsed(ts));
const kpi = (k, v) => h("div.kpi", h("small", k), h("b", { title: String(v) }, v));
function toast(msg) {
  const t = h("div.toast", msg); document.body.append(t); setTimeout(() => t.remove(), 3500);
}
function currentStage(o) {
  const s = o.stages.find((x) => x.status === "running" || x.status === "waiting" || x.status === "failed");
  if (s) return `${s.label}: ${s.error || s.detail || s.status}`;
  const done = o.stages.filter((x) => x.status === "done");
  return done.length ? `${done[done.length - 1].label}: ${done[done.length - 1].detail}` : "";
}

/* ---------------- list views ---------------- */

function renderNav() {
  const hot = summaries.filter((o) => ACTION.includes(o.state)).length;
  $("cOrders").replaceChildren(hot ? h("span.hotpill", { title: `${hot} need your action` }, hot) : "", String(summaries.length));
  $("cMarket").textContent = market ? market.filter((m) => m.status === "live").length : summaries.filter((o) => o.state === "live").length;
  document.querySelectorAll(".nav[data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("viewTitle").textContent = VIEWS[view];
  $("viewSelect").value = view;
  $("filters").hidden = view !== "orders";
  $("filters").replaceChildren(...FILTERS.map(([k, label, pred]) =>
    h("button.tab" + (filter === k ? ".on" : ""), { onclick: () => { filter = k; renderList(); } }, label, h("span.n", summaries.filter(pred).length))));
}

function setList(...nodes) { $("list").replaceChildren(...nodes.filter(Boolean)); }

function rowAttrs(o, openTab) {
  return { onclick: () => select(o.id, openTab), class: "row" + (selected === o.id ? " sel" : "") };
}

function renderList() {
  renderNav();
  const list = $("list");
  if (view === "market") { renderMarket(); return; }
  if (view === "billing") {
    setList(walletCard(), h("p.caption", { style: "padding:0 20px" }, `Credits pay for new environments (environment fee) and for QA-passed episodes you buy in the marketplace. ${config.pricing_note || ""}`));
    if (!wallet || Date.now() - walletAt > 5000) loadWallet();
    return;
  }
  if (!summaries.length) {
    list.replaceChildren(h("div.empty", h("div.box",
      h("div.ill", { html: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M11 3v3"/></svg>' }),
      h("h2", "No orders yet"),
      h("p", "Tell us the robot, the task, the environment and the data you need. The agents turn it into a spec, a MuJoCo plan and a cafe scene, then publish it as a game in the marketplace. Players play it, the QA Agent checks every episode, and you buy the episodes you want."),
      h("button.btn.primary", { onclick: openModal }, "Create first order"))));
    return;
  }
  let table;
  if (view === "orders") {
    const pred = FILTERS.find((f) => f[0] === filter)[2];
    const rows = summaries.filter(pred);
    table = h("table",
      h("thead", h("tr", h("th", "ID"), h("th", "Request"), h("th.hide-m.wide-only", "Type"), h("th", "Status"), h("th.hide-m", "Current step"), h("th.hide-m.wide-only", "Created"))),
      h("tbody", rows.map((o) => h("tr", rowAttrs(o),
        h("td.id", Agri.shortId(o.id)), h("td.req", Agri.title(o.text)),
        h("td.hide-m.wide-only", h("span.mode", modeLabel(o))), h("td", badge(o.state)),
        h("td.stage-c.hide-m", { title: currentStage(o) }, currentStage(o)), h("td.sub.hide-m.wide-only", Agri.ago(o.created_at))))));
    setList(table, rows.length ? null : h("div.none", "No orders match this filter."));
    return;
  }
}

/* ---------------- marketplace (all listings) ---------------- */

let market = null, marketAt = 0;
async function loadMarket() {
  marketAt = Date.now();
  try { market = await Agri.marketplace(); if (view === "market") renderList(); else renderNav(); } catch (e) { /* retry on next render */ }
}
function marketCard(m) {
  const own = summaries.some((o) => o.id === m.order_id);
  return h("article.mcard" + (own ? ".own" : ""), own ? { onclick: () => select(m.order_id, "market"), title: "Open your listing" } : {},
    m.scene_image_url ? h("img.mimg", { src: m.scene_image_url, alt: "MuJoCo render of the game scene", loading: "lazy" }) : h("div.mph", "Scene preview pending"),
    h("div.mb",
      h("div.mt", h("b", m.title), own ? h("span.mine", "Your listing") : null, badge(m.status)),
      h("div.kv", { style: "font-size:12.5px" }, `${m.robot} · ${m.scene}`),
      m.task_steps && m.task_steps.length ? h("ol", m.task_steps.map((t) => h("li", t))) : null,
      h("div.ms",
        h("div", h("small", "Submitted"), h("b", (m.episodes_submitted || 0).toLocaleString())),
        h("div", h("small", "QA passed"), h("b", (m.episodes_passed || 0).toLocaleString())),
        h("div", h("small", "Available"), h("b", (m.episodes_available || 0).toLocaleString()))),
      h("div.mf", h("span", `Player reward ${credits(m.reward_per_episode)}`), h("span", "·"), h("span", `Price ${credits(m.episode_price)} / episode`))));
}
function renderMarket() {
  if (!market || Date.now() - marketAt > 5000) loadMarket();
  if (!market) { setList(h("div.none", "Loading the marketplace…")); return; }
  setList(
    h("p.caption", { style: "padding:16px 20px 0;margin:0" }, "Every published game. Players pick one and play it in the browser; the QA Agent checks each episode. Open your own listing to buy its QA-passed episodes."),
    market.length ? h("div.mgrid", market.map(marketCard)) : h("div.none", "No games are published yet. Approve an order's spec: once the Environment Agent builds the scene, the game appears here."));
}

/* ---------------- wallet (credits, Stripe top-up) ---------------- */

let wallet = null, walletAt = 0;
const PACKS = [100, 500, 1000];
async function loadWallet() {
  walletAt = Date.now();
  try { wallet = await Agri.wallet(); if (view === "billing") renderList(); } catch (e) { /* retry on next render */ }
}
async function topUp(credits, btn) {
  btn.disabled = true;
  try {
    if (config.stripe) { const { url } = await Agri.walletCheckout(credits); location.href = url; return; }
    await Agri.walletTestTopup(credits); toast(`Added ${credits.toLocaleString()} test credits.`); await loadWallet();
  } catch (e) { toast(e.message); btn.disabled = false; }
}
const LEDGER_LABEL = { topup: "Top-up", fee: "Environment fee", purchase: "Episodes purchased", reward: "Player reward", hold: "Held for order", release: "Released", capture: "Episode charged", refund: "Refund", token_cost: "AI tokens" };
function walletCard() {
  if (!wallet) return h("div.wallet", h("span.caption", "Loading wallet…"));
  const me = `wallet:${wallet.customer_id}`;
  const rows = (wallet.entries || []).filter((e) => e.deltas && me in e.deltas).slice(0, 6);
  return h("div.wallet",
    h("div.wallet-top",
      h("div", h("small", { style: "color:var(--muted);font-size:12px" }, "Available credits"),
        h("div.wallet-bal", Math.round(wallet.available).toLocaleString(), h("small", `≈ ${Agri.usd(wallet.available * (wallet.credit_usd || 1))}`))),
      h("div", { style: "text-align:right" }, h("small", { style: "color:var(--muted);font-size:12px" }, "Held for active orders"),
        h("div", { style: "font-weight:600;font-size:15px" }, `${Math.round(wallet.held).toLocaleString()} credits`))),
    h("div.packs", PACKS.map((n) => h("button.btn" + (n === 1000 ? ".primary" : ""), { onclick: (e) => topUp(n, e.currentTarget) },
      `+${n.toLocaleString()} credits · ${Agri.usd(n * (wallet.credit_usd || 1))}`))),
    h("p.caption", { style: "margin:8px 0 0" }, config.stripe
      ? "Top-ups go through Stripe Checkout in test mode. Use card 4242 4242 4242 4242, any future date and CVC. No real charge."
      : "Test top-up: no card, no real charge. Set STRIPE_SECRET_KEY (sk_test_…) in .env to top up through Stripe."),
    rows.length ? h("table.ledger", h("tbody", rows.map((e) => h("tr",
      h("td", LEDGER_LABEL[e.kind] || e.kind), h("td", { style: "color:var(--muted)" }, e.at.replace("T", " ")),
      h("td.r", { style: `font-weight:600;color:${e.deltas[me] > 0 ? "var(--green)" : "var(--ink-2)"}` },
        `${e.deltas[me] > 0 ? "+" : ""}${Math.round(e.deltas[me]).toLocaleString()}`))))) : null);
}

/* ---------------- detail ---------------- */

const DEFAULT_TAB = { needs_reply: "conversation", needs_approval: "spec", live: "market", closed: "market" };

function select(id, openTab) {
  if (selected !== id) { selected = id; full = null; detailSig = ""; composerTa.value = drafts[id] || ""; }
  const s = summaries.find((o) => o.id === id);
  tab = openTab || DEFAULT_TAB[s && s.state] || "overview";
  renderList(); renderDetail(true); loadDetail();
}

async function loadDetail() {
  if (!selected) return;
  const id = selected;
  try {
    const o = await Agri.get(id);
    if (id !== selected) return;
    const sig = JSON.stringify(o);
    if (sig === detailSig) return;
    const wasState = full && full.state;
    full = o; detailSig = sig;
    if (wasState && wasState !== o.state && DEFAULT_TAB[o.state]) tab = DEFAULT_TAB[o.state];
    renderDetail(true);
    const listed = summaries.find((x) => x.id === id);
    if (listed && listed.state !== o.state) refreshList();
  } catch (e) { toast(e.message); }
}

function closeDetail() { selected = null; full = null; detailSig = ""; renderList(); renderDetail(true); }

function pipeline(o) {
  return h("div.pipe", o.stages.map((s) => h("div." + s.status, { title: `${s.owner}: ${s.status}${s.detail ? " · " + s.detail : ""}` }, s.label)));
}

function actionBar(o) {
  if (o.state === "needs_reply") return h("div.actbar.warn", h("span.msg-t", "The Customer Agent asked a few questions before it drafts the spec."),
    tab !== "conversation" ? h("button.btn.sm", { onclick: () => setTab("conversation") }, "Reply to agent") : null);
  if (o.state === "needs_approval") return h("div.actbar.warn", h("span.msg-t", "Review the spec. Approving pays the environment fee and hands the order to the Orchestrator Agent."),
    tab !== "spec" ? h("button.btn.sm", { onclick: () => setTab("spec") }, "Review spec") : null,
    approveBtn(o));
  if (o.state === "live" || o.state === "closed") {
    const L = o.listing || {};
    return h("div.actbar." + (o.state === "live" ? "ok" : "info"), h("span.msg-t",

/* ---------------- actions ---------------- */

async function act(kind, text) {
  const id = selected;
  try {
    if (kind === "answer") {
      if (!text) return composerTa.focus();
      sendBtn.disabled = true;
      await Agri.answer(id, text);
      composerTa.value = ""; drafts[id] = "";
    } else if (kind === "approve") {
      await Agri.approve(id); toast("Spec approved. Production started."); tab = "overview";
    } else if (kind === "retry") {
      await Agri.retry(id); toast("Retrying from the failed stage."); tab = "overview";
    } else if (kind === "purchase") {
      const r = await Agri.purchase(id, text); tab = "files";
      toast(`Bought ${text} episode${text === 1 ? "" : "s"}. Download them in Files.`);
      wallet = null;
      if (r && r.state) { full = r; detailSig = ""; }
    } else if (kind === "close") {
      await Agri.close(id); toast("Listing closed.");
    } else if (kind === "reopen") {
      await Agri.reopen(id); toast("Listing reopened.");
    }
  } catch (e) { toast(e.message); sendBtn.disabled = false; }
  await refreshList(); detailSig = ""; await loadDetail();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (e.key.toLowerCase() === "n" && !e.metaKey && !e.ctrlKey && !e.altKey && !/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openModal(); }
});
$("mText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("mSubmit").click(); });
$("mSubmit").onclick = async () => {
  const text = $("mText").value.trim();
  if (!text) return $("mText").focus();
  $("mSubmit").disabled = true;
  try {
    const o = await Agri.create(text, $("mAuto").checked);
    market = null;
    $("mText").value = ""; closeModal();
    view = "orders"; filter = "all";
    await refreshList(); select(o.id, "conversation");
  } catch (e) { $("mSubmit").disabled = false; toast("Could not create order: " + e.message); }
};
document.querySelectorAll(".nav[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; renderList(); }));
$("viewSelect").addEventListener("change", (e) => { view = e.target.value; closeDetail(); });

/* ---------------- polling ---------------- */

async function refreshList() {
  try {
    const items = await Agri.list();
    const sig = JSON.stringify(items);
    if (sig === listSig) return;
    listSig = sig; summaries = items;
    renderList();
    if (selected && !full) renderDetail(true);
  } catch (e) { /* server restarting; try again next tick */ }
}
const busy = (o) => o && (o.state === "running" || o.state === "live");
setInterval(() => { if (summaries.some(busy)) refreshList(); }, 3000);
setInterval(() => { if (selected && (!full || busy(full))) loadDetail(); }, 2000);
setInterval(() => { if (view === "market") loadMarket(); }, 5000);
setInterval(() => document.querySelectorAll("[data-since]").forEach((el) => { el.textContent = Agri.elapsed(+el.dataset.since); }), 1000);

Agri.config().then((c) => {
  config = c;
  $("demoPill").hidden = !c.demo;
  $("simFoot").textContent = "Simulator: MuJoCo · players in the marketplace";
});
Agri.examples().then((ex) => {
  const labels = { cafe_order: "Example: cafe coffee serving (EN)", cafe_failure_order: "Example: failure repro (EN)" };
  $("mEx").replaceChildren(...Object.keys(ex).map((k) => h("button", { onclick: () => { $("mText").value = ex[k].trim(); $("mText").focus(); } }, labels[k] || k)));
});
refreshList().then(renderList).then(async () => {
  // Returning from a Stripe credit top-up: ?topup=success|cancel&session_id=<id>
  const t = new URLSearchParams(location.search);
  if (t.get("topup")) {
    history.replaceState(null, "", location.pathname);
    if (t.get("topup") === "success") {
      try { const r = await Agri.walletConfirm(t.get("session_id")); wallet = r.wallet; toast(`Credits added via Stripe (test mode).`); }
      catch (e) { toast(e.message); }
    } else toast("Stripe checkout cancelled.");
    const nav = document.querySelector('.nav[data-view="billing"]'); if (nav) nav.click();
    return;
  }
});
if (USER) {
  $("userChip").hidden = false;
  $("userName").textContent = USER.name || USER.email;
  $("userAv").textContent = (USER.name || USER.email || "?").trim()[0].toUpperCase();
}
$("signOut").onclick = (e) => { e.preventDefault(); try { localStorage.removeItem("wemine_user"); } catch (err) { /* storage blocked */ } location.href = "/"; };
</script>
</body>
</html>
